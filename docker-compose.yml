# Starts postgres, backend and mocks. The frontend runs separately: cd frontend && npm run dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bharosa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bharosa}
      POSTGRES_DB: ${POSTGRES_DB:-bharosa}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bharosa}"]
      interval: 3s
      timeout: 3s
      retries: 20

  mocks:
    build: { context: ., dockerfile: mocks/Dockerfile }
    ports: ["8001:8001"]

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [.env.example]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bharosa}:${POSTGRES_PASSWORD:-bharosa}@postgres:5432/${POSTGRES_DB:-bharosa}
      # real mocks by default; run the demo scenarios with the built-in fake mocks:  BACKEND_MOCKS_URL= docker compose up
      MOCKS_URL: ${BACKEND_MOCKS_URL-http://mocks:8001}
      AI_MODE: ${AI_MODE:-stub}
      # what "this month" means in claim speech. The demo data (ledger, the open duplicate case) is for 2026-10
      AI_DEFAULT_PERIOD: ${AI_DEFAULT_PERIOD:-2026-10}
      PIPELINE_MODE: thread
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      UPLOAD_DIR: /data/uploads
      SEED_ON_START: "1"   # idempotent demo data (fake). Set to 0 to disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-not-for-production-0000}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      mocks: { condition: service_started }

volumes:
  postgres-data:
