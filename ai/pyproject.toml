[project]
name = "bharosa-ai"
version = "0.1.0"
description = "Bharosa AI functions (classifier, matching, OCR, extraction, decide, explain)"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bharosa_ai"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]

