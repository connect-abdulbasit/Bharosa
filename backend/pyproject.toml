[project]
name = "bharosa-backend"
version = "0.1.0"
description = "Bharosa platform API (FastAPI)"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
  "PyJWT>=2.8",
  "httpx>=0.26",
  "python-multipart>=0.0.9",
  "bcrypt>=4.0",
  "slowapi>=0.1.9",
  "Pillow>=10.0",
  "edge-tts>=6.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
monitoring = ["sentry-sdk>=1.40"]  # only used when SENTRY_DSN is set

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []  # app, not a library: this file only declares dependencies

[tool.pytest.ini_options]
markers = ["integration: needs the REAL AI package (AI_MODE=real); skipped when it is not implemented yet"]
addopts = "-m \"not integration\""  # run them with: make test-integration
pythonpath = [".", "..", "../ai"]
testpaths = ["tests"]

