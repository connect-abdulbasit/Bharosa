[project]
name = "bharosa-backend"
version = "0.1.0"
description = "Bharosa platform API (FastAPI)"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
  "PyJWT>=2.8",
  "httpx>=0.26",
  "python-multipart>=0.0.9",
  "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []  # app, not a library: this file only declares dependencies

[tool.pytest.ini_options]
pythonpath = [".", "..", "../ai"]
testpaths = ["tests"]

