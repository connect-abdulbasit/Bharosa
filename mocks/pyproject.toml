[project]
name = "bharosa-mocks"
version = "0.1.0"
description = "Simulated identity, ledger, complaints, senders, notify and chaos services"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.26", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []  # app, not a library: this file only declares dependencies

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]

